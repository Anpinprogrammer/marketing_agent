[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-agent"
version = "0.1.0"
description = "Agente de marketing de SAM Digital"
requires-python = ">=3.12"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
managed = ["anthropic>=2.3,<3"]
tablero = [
    "anthropic>=2.3,<3",
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
]

[tool.setuptools.packages.find]
include = ["pruebas_motor*", "tablero*"]

[tool.setuptools.package-data]
pruebas_motor = ["paginas/*.html", "kit/**/*.md"]
tablero = ["datos/*.json", "static/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
